{% assign music = site.music_player %}
<section class="sidebar-music-player" aria-label="음악 플레이어" data-music-player data-audio-src="{{ music.src | escape }}">
  <div class="music-player-artwork">
    <img src="{{ '/assets/img/music-player-paper.png' | relative_url }}" alt="" draggable="false">
    <span class="music-artwork-heart" aria-hidden="true"><i class="far fa-heart"></i></span>
    <span class="music-artwork-more" aria-hidden="true"><i class="fas fa-ellipsis-h"></i></span>
    <input class="music-artwork-seek" type="range" min="0" max="1000" value="0" aria-label="재생 위치" data-seek disabled>
    <span class="music-artwork-time music-artwork-current" data-current-time>0:00</span>
    <span class="music-artwork-time music-artwork-duration" data-duration>0:00</span>
    <span class="music-artwork-title" data-track-title>{{ music.title | escape }}</span>
    <div class="music-artwork-secondary-controls" aria-hidden="true">
      <i class="fas fa-random"></i>
      <i class="fas fa-step-backward"></i>
      <i class="fas fa-step-forward"></i>
      <i class="fas fa-redo-alt"></i>
    </div>
    <button class="music-artwork-play" type="button" data-play aria-label="재생" disabled>
      <i class="fas fa-play" aria-hidden="true"></i>
    </button>
  </div>
  <audio preload="none" data-audio></audio>
</section>
<p class="music-player-caption">AI로 만든 노래</p>

<script>
  (() => {
    const player = document.querySelector('[data-music-player]');
    if (!player) return;

    const audio = player.querySelector('[data-audio]');
    const playButton = player.querySelector('[data-play]');
    const seek = player.querySelector('[data-seek]');
    const currentTime = player.querySelector('[data-current-time]');
    const duration = player.querySelector('[data-duration]');
    const source = player.dataset.audioSrc;

    const formatTime = (seconds) => {
      if (!Number.isFinite(seconds)) return '0:00';
      const minutes = Math.floor(seconds / 60);
      const remainder = Math.floor(seconds % 60).toString().padStart(2, '0');
      return `${minutes}:${remainder}`;
    };

    if (!source) return;

    player.classList.add('has-audio');
    audio.src = source;
    playButton.disabled = false;
    seek.disabled = false;
    playButton.setAttribute('aria-label', '재생');

    playButton.addEventListener('click', async () => {
      if (audio.paused) {
        try {
          await audio.play();
        } catch (error) {
          playButton.setAttribute('aria-label', '재생할 수 없는 음원입니다');
        }
      } else {
        audio.pause();
      }
    });

    audio.addEventListener('play', () => {
      player.classList.add('is-playing');
      playButton.innerHTML = '<i class="fas fa-pause" aria-hidden="true"></i>';
      playButton.setAttribute('aria-label', '일시정지');
    });

    audio.addEventListener('pause', () => {
      player.classList.remove('is-playing');
      playButton.innerHTML = '<i class="fas fa-play" aria-hidden="true"></i>';
      playButton.setAttribute('aria-label', '재생');
    });

    audio.addEventListener('loadedmetadata', () => {
      duration.textContent = formatTime(audio.duration);
      currentTime.textContent = formatTime(audio.currentTime);
      seek.value = 0;
    });

    audio.addEventListener('timeupdate', () => {
      currentTime.textContent = formatTime(audio.currentTime);
      if (Number.isFinite(audio.duration) && audio.duration > 0) {
        seek.value = Math.round((audio.currentTime / audio.duration) * 1000);
        seek.style.setProperty('--progress', `${(audio.currentTime / audio.duration) * 100}%`);
      }
    });

    seek.addEventListener('input', () => {
      if (Number.isFinite(audio.duration)) {
        audio.currentTime = (Number(seek.value) / 1000) * audio.duration;
      }
    });

    audio.addEventListener('ended', () => {
      player.classList.remove('is-playing');
      playButton.innerHTML = '<i class="fas fa-play" aria-hidden="true"></i>';
      playButton.setAttribute('aria-label', '재생');
    });

    audio.addEventListener('error', () => {
      playButton.disabled = true;
      seek.disabled = true;
      playButton.setAttribute('aria-label', '음원을 불러오지 못했습니다');
    });
  })();
</script>
