{% assign topic_posts = site.categories[page.topic_category] %}

{% if topic_posts and topic_posts.size > 0 %}
<ul class="topic-post-list">
  {% for post in topic_posts %}
  <li>
    <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
    <span class="text-muted"> · {{ post.date | date: '%Y-%m-%d' }}</span>
  </li>
  {% endfor %}
</ul>
{% else %}
<p>아직 이 카테고리에 게시글이 없습니다.</p>
{% endif %}

<p><a href="{{ '/categories/' | relative_url }}">← 전체 카테고리</a></p>
